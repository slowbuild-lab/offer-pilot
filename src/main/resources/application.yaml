spring:
  application:
    name: get_jobs
  profiles:
    active: dev
  info:
    app:
      name: Get Jobs
      version: 2.0.1
      description: https://github.com/slowbuild-lab/offer-pilot
  banner:
    charset: UTF-8
    location: classpath:banner.txt
  datasource:
    # 多平台并行后写入会同时发生：busy_timeout 让 SQLite 等待锁而不是立刻报 SQLITE_BUSY，
    # WAL 让读不阻塞写（投递记录读写与前端状态查询会并发）。
    url: jdbc:sqlite:./db/getjobs.db?busy_timeout=15000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      connection-test-query: SELECT 1
      # 每条连接都设置等待时间，避免某个连接绕过 URL 参数
      connection-init-sql: PRAGMA busy_timeout=15000
  sql:
    init:
      mode: never  # 数据库文件已存在，不需要自动初始化
  output:
    ansi:
      enabled: always

# 服务器配置
server:
  port: 9527  # 后端 API 固定端口（别用 9679：落在 Windows Hyper-V 保留段 9628-9727 里，绑不上）

# 日志配置
logging:
  level:
    root: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){magenta} %clr(%-5level){highlight} %clr(%logger{36}){cyan} %clr(-){faint} %msg%n"
  file:
    name: ./target/logs/get-jobs.log
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: true  # 打开 MyBatis Plus 启动 banner
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml
